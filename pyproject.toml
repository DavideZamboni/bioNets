[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mypsns"
version = "0.1.0"
description = "Protein Structure Network analysis tools"
authors = [
    { name="Davide" }
]

requires-python = ">=3.11"

dependencies = [
    # Analysis
    "numpy>=1.26",
    "pandas>=2.2",
    "MDAnalysis",
    "networkx>=3.2",

    # plotting
    "matplotlib>=3.8",

    #
    "psutil",

    # CLI stack
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "PyYAML>=6.0",
] 

# cli entrance
[project.scripts]
mypsns = "mypsns.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mypsns*"]

[tool.setuptools.package-data]
mypsns = ["resources/*.csv"]

[tool.setuptools]
include-package-data = true

# [project.scripts]
# mypsns = "mypsns.main:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff"
]
