# =============================================================================
# myPSNs — network configuration (every parameter at its default)
# Run with:  mypsns network --config network_config_example.yml
# =============================================================================
#
# Builds residue-interaction networks from an existing Contacts run and renders
# PyMOL sessions. Requires the upstream stages (ff-reader → topology →
# interactors → contacts) to have already populated <outpath>/Interactors/ and
# <outpath>/Adjacency/.
#
# Every value below is shown at its built-in default, so this file reproduces
# the default behaviour exactly. Optional features that are OFF by default
# (n_frames, time-resolved windows, frame range, reference_pdb) are left
# commented — uncomment to enable.

# ── Top-level paths (PipelineConfig requires these even for a single stage) ──
topology:   /path/to/system.gro          # .gro / .pdb / .tpr — same as the rest of the pipeline
forcefield: /path/to/ff/ffnonbonded.itp  # not used by `network`, but required by the schema
outpath:    /path/to/run_output          # must already contain Interactors/ + Adjacency/


network:
  # ── Frame count (informational only — logged, not required) ───────────────
  # n_frames: 10000

  # ── Which contact tables to consume ───────────────────────────────────────
  interactors_type:                # Adjacency/ sub-folders to scan
    - q_interactors
    - named_interactors
  targets:                         # contact types contributing to the graph
    - HBonds
    - Salt_bridges
    - HCs

  # ── Edge weight: one network is built per source ──────────────────────────
  edge_weight_sources:
    - persistency                  # *_adjacency.dat   (contact frequency)
    - energy                       # *_total_energy.dat (LJ + Coulomb, kJ/mol)
  energy_use_abs: false            # false → attractive only: w = max(0, -E)
                                   # true  → |E|, also counts repulsive

  # ── Node / community analysis ─────────────────────────────────────────────
  node_metrics:                    # one .pml per metric × community × source
    - betweenness_centrality
    # other choices: degree | weighted_degree | degree_centrality | closeness_centrality
  community_methods:
    - louvain
    # other choices: greedy_modularity | label_propagation | connected_components
  community_seed: 42               # seed for stochastic community algorithms

  # ── Filtering ─────────────────────────────────────────────────────────────
  # Both thresholds are percentages on the 0..100 scale the elbow / degree
  # plots are scanned on. An edge is kept when its weight (%) is strictly
  # greater than the threshold for its source.
  min_persistency: 0.0             # persistency graphs: percent contact frequency, 0..100
  min_energy: 0.0                  # energy graphs: percent of the strongest edge, 0..100
  min_degree: 0                    # drop nodes below this degree

  # ── PyMOL rendering ───────────────────────────────────────────────────────
  # reference_pdb: /path/to/representative.pdb   # default: the topology above
  sphere_scale: 2.0                # max CA-sphere vdw radius [Å] (largest node metric)
  stick_scale: 0.5                 # max edge dash radius [Å] (largest edge weight)

  # ── Auxiliary outputs ─────────────────────────────────────────────────────
  write_graphml: false             # also write one GraphML per static graph
  shortest_paths: false            # all-pairs weighted shortest paths per graph

  # ── Time-resolved community tracking (OFF by default) ─────────────────────
  # Set window_size to also build one energy network per frame-window and write
  # community_evolution_<inttype>_<source>_<method>.csv.
  # window_size: 500               # frames per window
  # window_stride: 500             # step between windows (defaults to window_size)

  # ── Frame range (OFF by default; applies to BOTH static and time-resolved) ─
  # When set, static networks are re-aggregated from the per-frame energy CSVs
  # over [frame_start, frame_stop) instead of the pre-aggregated matrices.
  # frame_start: 0                 # inclusive
  # frame_stop:  10000             # exclusive

  # ── NA strings passed to every pandas.read_csv (default list shown) ───────
  # "NA" is intentionally excluded so sodium (NA) is not parsed as missing.
  na_values:
    - ""
    - "#N/A"
    - "#N/A N/A"
    - "#NA"
    - "-1.#IND"
    - "-1.#QNAN"
    - "-NaN"
    - "-nan"
    - "1.#IND"
    - "1.#QNAN"
    - "<NA>"
    - "N/A"
    - "NULL"
    - "NaN"
    - "n/a"
    - "nan"
    - "null"
