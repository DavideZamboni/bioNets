name: mypsns

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip

  # scientific stack
  - numpy>=1.26
  - pandas>=2.2
  - matplotlib>=3.8
  - networkx>=3.2
  - psutil
  - mdanalysis>=2.7
  - scipy

  # `variants` extra in pyproject.toml: `mypsns compare-variants` (ClinVar + RefSeq alignment)
  - requests
  - biopython

  # `dev` extra in pyproject.toml (tests: `pytest` from the repo root)
  - pytest

  # install package
  - pip:
      - -e .
